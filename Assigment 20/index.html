    function calculator(num1, num2, operator) {
        if (operator == "+") {
        return num1 + num2;
        } else if (operator == "-") {
        return num1 - num2;
        } else if (operator == "*") {
        return num1 * num2;
        } else if (operator == "/") {
        return num1 / num2;
        } else {
        return "Invalid operator";
        }
    }

    var number2 = Number(prompt("Enter second number:"));
    var op = prompt("Enter operator (+, -, *, /):");

    function calculateHypotenuse(base, perpendicular) {

    var baseSquare;
    var perpendicularSquare;
    var hypotenuse;

    }
    baseSquare = calculateSquare(base);

    function pal(str) {
    var i;
    for (i = 0; i < str.length / 2; i++) {
        if (str[i] !== str[str.length - 1 - i]) {
            return "Not Palindrome";
        }
    }
        return "Palindrome";
    }

    function cap(str) {
    var words = str.split(" ");
    var i;

    for (i = 0; i < words.length; i++) {
        words[i] = words[i][0].toUpperCase() + words[i].slice(1);
    }

        return words.join(" ");
    }
    var result = cap("the quick brown fox");
    // console.log(result);

    function lw(str) {
    var words = str.split(" ");
    var max = words[0];
    var i;

    for (i = 1; i < words.length; i++) {
        if (words[i].length > max.length) {
            max = words[i];
        }
    }
        return max;
    }
    var result = lw("Web Development Tutorial");
    console.log(result);

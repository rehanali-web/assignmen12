                          // Question 6

document.write("Counting:<br><br>");
for (let i = 1; i <= 15; i++) {
 document.write(i + (i < 15 ? ", " : ""));
}

document.write("<br><br>Reverse counting:<br><br>");
for (let i = 10; i >= 1; i--) {
 document.write(i + (i > 1 ? ", " : ""));
}

document.write("<br><br>Even:<br><br>");
for (let i = 0; i <= 20; i += 2) {
document.write(i + (i < 20 ? ", " : ""));
}

document.write("<br><br>Odd:<br><br>");
for (let i = 1; i <= 19; i += 2) {
 document.write(i + (i < 19 ? ", " : ""));
}

document.write("<br><br>Series:<br><br>");
for (let i = 2; i <= 20; i += 2) {
document.write(i + "k" + (i < 20 ? ", " : ""));
}

 }
